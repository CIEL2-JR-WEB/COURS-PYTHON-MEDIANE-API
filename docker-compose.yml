services:
  web:
    image: nginx:alpine
    container_name: ciel_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - api

  api:
    build: ./api
    container_name: ciel_flask_api
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./api:/app
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=1
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DB=CRUD
      - MYSQL_USER=eleve
      - MYSQL_PASSWORD=eleve
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: ciel_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: CRUD
      MYSQL_USER: eleve
      MYSQL_PASSWORD: eleve
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "eleve", "-peleve"]
      interval: 5s
      timeout: 5s
      retries: 10
